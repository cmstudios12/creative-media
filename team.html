<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CMSTUDIOS — The Team</title>

<!-- Remix Icons -->
<link href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css" rel="stylesheet">

<style>
:root{
  --bg:#0b0e14;
  --bg-2:#0e1220;
  --glass: rgba(255,255,255,.06);
  --glass-2: rgba(255,255,255,.12);
  --stroke: rgba(255,255,255,.12);
  --text:#e9edf7;
  --muted:#a9b1c3;
  --cyan:#51e5ff;
  --violet:#9b6bff;
  --lime:#c7ff6b;
  --rose:#ff6bb0;
  --amber:#ffdd66;
  --shadow: 0 20px 60px rgba(0,0,0,.35);
  --radius: 22px;
}

*{box-sizing:border-box}
body{
  margin:0;
  font:16px/1.6 ui-sans-serif,system-ui,Segoe UI,Roboto,Inter,Arial;
  color:var(--text);
  background:
    radial-gradient(1200px 800px at 85% -10%, #2a1f57 0%, transparent 60%),
    radial-gradient(900px 600px at -10% 90%, #0e4652 0%, transparent 60%),
    linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
  background-attachment: fixed;
  overflow-x:hidden;
  scroll-behavior:smooth;
}

/* Sidebar */
.sidebar{
  position:fixed; inset:0 auto 0 20px; height:fit-content; margin:auto;
  display:flex; flex-direction:column; gap:14px; z-index:50;
  padding:12px; border-radius:999px;
  background:var(--glass);
  backdrop-filter: blur(16px);
  border:1px solid var(--stroke);
  box-shadow: var(--shadow);
}
.nav-dot{
  width:56px;height:56px; border-radius:50%;
  display:grid;place-items:center; font-size:22px; color:var(--muted);
  background:linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.02));
  border:1px solid var(--stroke);
  transition:transform .25s ease, color .25s ease, background .25s ease, box-shadow .25s ease;
  position:relative; cursor:pointer; text-decoration:none;
}
.nav-dot:hover{ color:var(--cyan); transform:translateX(4px); box-shadow:0 8px 30px rgba(81,229,255,.18) }
.nav-dot.active{ color:var(--amber); box-shadow:0 0 0 2px rgba(255,221,102,.25) inset }
.nav-dot .tip{
  position:absolute; left:68px; top:50%; transform:translateY(-50%) translateX(-6px);
  padding:6px 10px; font-size:12px; color:var(--text); white-space:nowrap;
  background:var(--glass-2); backdrop-filter:blur(10px);
  border:1px solid var(--stroke); border-radius:10px; opacity:0; pointer-events:none; transition:.25s ease;
}
.nav-dot:hover .tip{opacity:1; transform:translateY(-50%) translateX(0)}

/* Sections */
section{
  min-height:100svh;
  display:grid; align-content:center; justify-items:center;
  padding:100px 28px 80px 110px;
  position:relative;
}
.section-inner{ width:min(1200px,100%); display:grid; gap:26px }

h1,h2{ margin:0; line-height:1.1; background:linear-gradient(90deg, var(--text) 0%, #e6e9ff 30%, #b1b7ff 60%, #78fff0 100%); -webkit-background-clip:text; background-clip:text; color:transparent; }
h1{font-size: clamp(32px, 6vw, 64px)}
h2{font-size: clamp(26px, 4vw, 40px)}
p, small{margin:0;color:var(--muted)}

.glass{
  background:var(--glass);
  border:1px solid var(--stroke);
  backdrop-filter: blur(14px);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:24px;
  display:grid; gap:16px;
}

/* Team Grid */
.team{ display:grid; grid-template-columns:repeat(4,1fr); gap:16px; }
.member{ text-align:center; }
.member .avatar{ width:100%; aspect-ratio:1/1; border-radius:50%; overflow:hidden; }
.member .avatar img{ width:100%; height:100%; object-fit:cover; }
.member strong{ display:block; margin-top:8px; }
.member small{ display:block; color:var(--muted); }

@media (max-width:1100px){ .team{grid-template-columns:repeat(2,1fr)} }
@media (max-width:700px){ .team{grid-template-columns:1fr} }

/* Back button */
.back-btn{
  display:inline-block;
  margin-bottom:16px;
  padding:8px 14px;
  border-radius:12px;
  border:1px solid var(--stroke);
  background:var(--glass-2);
  color:var(--text);
  text-decoration:none;
  font-weight:600;
  transition: transform .15s ease, box-shadow .25s ease;
}
.back-btn:hover{ transform:translateY(-2px); box-shadow:0 10px 30px rgba(81,229,255,.2); }

/* ===== Mobile tweaks ===== */
@media (max-width:900px){
  section { padding:80px 16px 120px 16px; } 
  .sidebar { 
    position: fixed !important;
    top: auto !important;
    left: 50% !important;
    bottom: 20px !important;
    transform: translateX(-50%) !important;
    flex-direction: row; 
    border-radius: 30px; 
    padding: 10px 14px; 
    gap: 12px; 
  }
  .nav-dot { width: 48px !important; height: 48px !important; font-size: 20px !important; }
  .nav-dot .tip { display: none !important; }
}
</style>
</head>
<body>

<!-- Sidebar -->
<nav class="sidebar">
  <a class="nav-dot" href="index.html" aria-label="Home"><i class="ri-home-4-line"></i><span class="tip">Home</span></a>
  <a class="nav-dot" href="index.html#services" aria-label="Services"><i class="ri-briefcase-line"></i><span class="tip">Services</span></a>
  <a class="nav-dot" href="index.html#contact" aria-label="Contact"><i class="ri-mail-line"></i><span class="tip">Contact</span></a>
</nav>

<!-- Team Section -->
<section>
  <div class="section-inner">
    <a class="back-btn" href="index.html"><i class="ri-arrow-left-line"></i> Back</a>
    <span class="kicker reveal">The Team</span>
    <h2 class="reveal">A multi-disciplinary group of specialists</h2>
    <div class="team reveal">
      <div class="glass member reveal">
        <div class="avatar"><img src="ceo.jpg"></div>
        <strong>Fakude JN.</strong><small>Founder & Creative Director</small>
      </div>
      <div class="glass member reveal">
        <div class="avatar"><img src="coo.jpg"></div>
        <strong>Khoza N.</strong><small>COO</small>
      </div>
      <div class="glass member reveal">
        <div class="avatar"><img src="nathi.png"></div>
        <strong>Ngomane N.</strong><small>Photographer</small>
      </div>
    </div>
  </div>
</section>

<script>
// Scroll reveal
const io = new IntersectionObserver((entries)=>{
  entries.forEach(e => { if(e.isIntersecting) e.target.classList.add('in'); });
}, { threshold: .12 });
document.querySelectorAll('.reveal').forEach(el=>io.observe(el));

// Scrollspy for sidebar (optional)
const links = [...document.querySelectorAll('.nav-dot')];
const sections = [...document.querySelectorAll('section')];
const spy = new IntersectionObserver((entries)=>{
  entries.forEach(entry=>{
    if(entry.isIntersecting){
      links.forEach(a=>a.classList.remove('active'));
    }
  })
}, { rootMargin: '-40% 0px -50% 0px', threshold:.01 });
sections.forEach(s=>spy.observe(s));
</script>
</body>
</html>
